<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0284C7">
  <title>Halaman Tidak Ditemukan - WashPass</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 440px; }
    .code {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: clamp(4rem, 15vw, 7rem);
      font-weight: 800;
      color: #0284C7;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 12px 0 8px; }
    p { color: #475569; margin-bottom: 28px; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 12px 24px;
      background: #0284C7;
      color: #fff;
      border: 2px solid #0284C7;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { background: #0369A1; border-color: #0369A1; transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid #38BDF8; outline-offset: 2px; }
    .link { display: block; margin-top: 20px; color: #0284C7; font-weight: 600; text-decoration: none; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap" id="main">
    <div class="code" aria-hidden="true">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Halaman yang Anda cari tidak ada atau sudah dipindahkan. Coba mulai dari beranda atau lacak pesanan Anda.</p>
    <a href="/" class="btn">
      Kembali ke Beranda
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
    <a href="/track" class="link">Lacak pesanan Anda</a>
  </main>
</body>
</html>
